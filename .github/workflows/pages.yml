name: Publish to GitHub Pages

# Pages serves the gh-pages branch; this mirrors the working branch to it
# on every push so edits (e.g. flights.json) deploy automatically.
on:
  push:
    branches:
      - claude/new-repo-pages-mobile-3nnfc9
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror to gh-pages
        run: git push --force origin HEAD:gh-pages
